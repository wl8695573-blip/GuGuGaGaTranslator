name: Build and regression checks
on: [push, pull_request]
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build GuGuGaGaTranslator.slnx -c Release
      - run: dotnet run --project tools/Regression -c Release
      - run: dotnet run --project tools/Benchmark -c Release -- --engine rapid --iterations 3 --check
      - run: dotnet run --project tools/UiPreview -c Release -- .artifacts/ui
      - run: dotnet build tools/Installer/Installer.csproj -c Release
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-evidence
          path: |
            .artifacts/benchmark-rapid
            .artifacts/ui/*.png
