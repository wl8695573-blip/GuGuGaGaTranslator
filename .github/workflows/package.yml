name: Package acceptance
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'build.ps1'
      - 'tools/Installer/**'
      - 'tools/verify-release.ps1'
      - 'tools/sign-release.ps1'
      - 'src/**'
      - 'Directory.Build.props'
      - '.github/workflows/package.yml'
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build unsigned acceptance artifacts
        shell: pwsh
        run: ./build.ps1 -Publish -SingleFile -Zip -Installer
      - name: Install, upgrade, uninstall and portable checks
        shell: pwsh
        run: ./tools/verify-release.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: package-acceptance
          path: |
            dist/*
            .artifacts/verify-*/*.json
